name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Validate language files
        run: python3 src/check_lang.py
      - name: Validate map data
        run: python3 src/check_data.py
      - uses: actions/setup-node@v7
        with: { node-version: "24" }
      - name: Smoke test the bundle
        run: node src/smoke.mjs

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-pages-artifact@v5
        with: { path: docs }
      - id: deploy
        uses: actions/deploy-pages@v5
